<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Big screen · CGC Live Translation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  /* Designed at 1280 × 720 and scaled to whatever the projector gives:
     --u is one design pixel. */
  :root { --u: min(calc(100vw / 1280), calc(100vh / 720)); }
  html, body { height: 100%; }
  body { background: var(--indigo-dark); color: var(--white); overflow: hidden; cursor: none; }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
  .glow {
    position: absolute; right: calc(-160 * var(--u)); top: calc(-160 * var(--u));
    width: calc(520 * var(--u)); height: calc(520 * var(--u)); border-radius: 50%;
    background: radial-gradient(circle, rgba(0,202,204,.16), rgba(0,202,204,0) 70%);
  }
  .top {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    padding: calc(36 * var(--u)) calc(64 * var(--u)) 0;
    font: 500 calc(14 * var(--u)) var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan-light);
  }
  .live { display: flex; align-items: center; gap: calc(10 * var(--u)); }
  .live [lang|="zh"] { font-family: var(--font-zh); letter-spacing: .1em; }
  .dot { width: calc(10 * var(--u)); height: calc(10 * var(--u)); border-radius: 50%; background: var(--cyan); }
  .reconnecting .dot { background: var(--amber); }
  .reconnecting .top-right { color: var(--caption-dim); }

  .captions {
    /* overflow: hidden is the last resort, for a line too long even at the
       smallest fit: it's cut at the top rather than painted over the header. */
    position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 calc(64 * var(--u)) calc(72 * var(--u)); gap: calc(28 * var(--u));
  }
  .previous { font-weight: 500; font-size: calc(34 * var(--u)); line-height: 1.5; color: var(--caption-dim); text-wrap: pretty; }
  .current-block {
    display: flex; flex-direction: column; gap: calc(18 * var(--u));
    border-top: 2px solid rgba(224,250,250,.18); padding-top: calc(28 * var(--u));
  }
  .current { font-weight: 700; font-size: calc(64 * var(--u) * var(--fit, 1)); line-height: 1.35; letter-spacing: .01em; color: var(--white); text-wrap: pretty; }
  .current.placeholder { color: var(--caption-dim); font-weight: 500; }
  .sub { font-weight: 500; font-size: calc(28 * var(--u) * var(--fit, 1)); line-height: 1.45; color: var(--cyan-light); text-wrap: pretty; }
  .bottom-bar { height: calc(5 * var(--u)); min-height: 3px; background: var(--accent-bar); flex: none; }

  /* The phone page QR, shown when the operator asks for it. */
  .qr-panel {
    position: absolute; right: calc(64 * var(--u)); top: calc(84 * var(--u));
    display: flex; align-items: center; gap: calc(20 * var(--u));
    background: var(--white); color: var(--charcoal); border-radius: calc(16 * var(--u)); padding: calc(18 * var(--u));
    box-shadow: 0 8px 28px rgba(0,0,0,.25);
  }
  .qr-panel .qr { width: calc(180 * var(--u)); height: calc(180 * var(--u)); }
  .qr-panel .qr svg { display: block; width: 100%; height: 100%; }
  .qr-panel .qr-text { display: flex; flex-direction: column; gap: calc(6 * var(--u)); padding-right: calc(8 * var(--u)); }
  .qr-panel .t1 { font: 700 calc(22 * var(--u)) var(--font-ui); }
  .qr-panel .t1[lang|="zh"] { font-family: var(--font-zh); }
  .qr-panel .t2 { font: 500 calc(17 * var(--u)) var(--font-mono); color: var(--mid); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow"></div>
  <div class="top">
    <span class="live"><span class="dot"></span><span id="live-label">Live</span></span>
    <span class="top-right" id="top-right">Scan for captions on your phone</span>
  </div>
  <div class="captions" id="captions">
    <div class="previous" id="previous" hidden></div>
    <div class="current-block">
      <div class="current" id="current"></div>
      <div class="sub" id="sub" hidden></div>
    </div>
  </div>
  <div class="qr-panel" id="qr-panel" hidden>
    <div class="qr" id="qr"></div>
    <div class="qr-text"><span class="t1" id="qr-t1"></span><span class="t2" id="qr-url"></span></div>
  </div>
  <div class="bottom-bar"></div>
</div>
<script type="module" src="screen.js"></script>
</body>
</html>
