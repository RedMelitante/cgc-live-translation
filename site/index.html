<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Live sermon captions from Cagayan Gospel Church.">
<title>Live captions · Cagayan Gospel Church</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@400&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<style>
  html, body { height: 100%; }
  body { background: var(--white); }
  .page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }
  .head {
    padding: max(14px, env(safe-area-inset-top)) 20px 14px; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 12px; flex: none;
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title { display: flex; flex-direction: column; gap: 2px; }
  .church { font: 800 19px/1.2 var(--font-head); color: var(--charcoal); }
  .live {
    display: flex; align-items: center; gap: 6px; font: 400 10px var(--font-mono);
    letter-spacing: .14em; text-transform: uppercase; color: var(--success-text);
  }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .reconnecting .live { color: var(--warning-text); }
  .reconnecting .live .dot { background: var(--amber); }
  .size {
    width: 44px; height: 44px; border-radius: 100px; border: 1.5px solid var(--border); background: var(--white);
    cursor: pointer; font: 700 15px var(--font-head); color: var(--indigo); flex: none;
  }
  .seg { display: flex; background: var(--surface); border-radius: 100px; padding: 4px; gap: 4px; }
  .seg button {
    flex: 1; height: 36px; border-radius: 100px; border: none; cursor: pointer; font: 600 14px var(--font-ui);
    background: transparent; color: var(--mid); transition: background .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .seg button.on { background: var(--white); color: var(--indigo); box-shadow: 0 1px 4px rgba(45,49,66,.10); }
  .seg [lang|="zh"] { font-family: var(--font-zh); }

  .lines {
    flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    gap: 18px; padding: 20px 20px 12px;
  }
  .old { display: flex; flex-direction: column; gap: 4px; flex: none; }
  .old .main { font-weight: 400; font-size: var(--old); line-height: 1.6; color: var(--mid); }
  .old .sub { font-weight: 400; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .latest { display: flex; flex-direction: column; gap: 6px; background: var(--indigo-light); border-radius: 16px; padding: 16px 18px; flex: none; }
  .latest .main { font-weight: 700; font-size: var(--new); line-height: 1.55; color: var(--indigo-dark); text-wrap: pretty; }
  .latest .sub { font-weight: 400; font-size: 14px; line-height: 1.5; color: var(--dark); }
  .waiting { text-align: center; font: 400 15px/1.6 var(--font-ui); color: var(--muted); padding: 0 12px 24px; }
  .waiting[lang|="zh"] { font-family: var(--font-zh); }
  .foot { flex: none; padding: 10px 20px max(18px, env(safe-area-inset-bottom)); text-align: center; font: 400 12px/1.5 var(--font-ui); color: var(--muted); }
</style>
</head>
<body>
<div class="page" id="page">
  <header class="head">
    <div class="title-row">
      <div class="title">
        <span class="church">Cagayan Gospel Church</span>
        <span class="live"><span class="dot"></span><span id="live-label">Live sermon captions</span></span>
      </div>
      <button class="size" id="size" aria-label="Change text size">Aa</button>
    </div>
    <div class="seg" id="langs">
      <button data-mode="both"></button>
      <button data-mode="tgt"></button>
    </div>
  </header>
  <main class="lines" id="lines" aria-live="polite"></main>
  <footer class="foot">Captions are machine-translated and checked by our media team.</footer>
</div>
<script type="module" src="phone.js"></script>
</body>
</html>
